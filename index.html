<!DOCTYPE html>
<html>
<head>
  <style>
    .box{
      font-family:serif;
      font-weight:bold;
      font-size:24px;
      margin:10px;
      padding:10px;
      width:400px;
    }
    */Top box:double red border and light blue background*/
    .style1{
      background-color:lightblue;
      border:5px double red;
    }
    */Middle box:solid blue border, yellow background and rounded corners*/
    .style2{
      background-color:yellow;
      border:2px solid blue;
      border-radius:15px;
    }
    */Bottom box:dotted border and green background
    .style3{
      background-color:forestgreen;
      border:5px dotted #444;
      
  </style>
</head>
<body>
  <div class="box style1">Hello World</div>
  <div class="box style2">Hello World</div>
  <div class="box style3">Hello World</div>
  
</body>
</html>
